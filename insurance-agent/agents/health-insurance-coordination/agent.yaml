# Human-readable app slug used by Agentic Platform tooling.

# `agentic create` should rewrite this when generating a new app from the template.

name: health-insurance-coordination
# Python import path to the Magenta SDK App instance.

# Format: <module path>:<variable name>. This template exposes `app` from

# src/insurance_agent/main.py.
entrypoint: agent_health_insurance_coordination.main:app
framework: langgraph
network:
  egress_mode: allow_list
  atlas_clusters:
    - ist-shared.n0kts.mongodb.net
  egress:
    # Without this the sandbox can reach Atlas but not the model gateway, and
    # every LLM call fails with "Connection error".
    - fqdn: grove-gateway-prod.azure-api.net
      ports: [443]

sandboxes:
  agent:
    secrets: ['*']
  tool:
    secrets: ['*']
    tools:
      - get_current_date
      - save_user_info
      - recall_user_info
      - get_member_by_id
      - get_policy_by_id
      - get_plan_by_id
      - get_audit_trace
      - list_all_members
      - list_all_policies
      - list_all_plans
      - list_all_claims
      - list_all_audit_traces
      - list_pending_authorizations
      - verify_eligibility_on_date
      - check_treatment_coverage
      - create_claim
      - update_claim_status
      - create_audit_trace
      - append_reasoning_step
      - route_decision
      - close_administrative_determination
      - close_authorization
      - escalate_to_human
      - update_pending_action
      - update_member_summary
