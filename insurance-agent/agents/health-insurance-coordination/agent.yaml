# Human-readable app slug used by Agentic Platform tooling.
# `agentic create` should rewrite this when generating a new app from the template.
name: health-insurance-coordination
# Python import path to the Magenta SDK App instance.
# Format: <module path>:<variable name>. This template exposes `app` from
# src/insurance_agent/main.py.
entrypoint: agent_health_insurance_coordination.main:app
framework: langgraph
config:
    provider: openai
    model: gpt-5.4
network:
  atlas_clusters:
    - ist-shared.n0kts.mongodb.net
#   egress:
#     - fqdn: grove-gateway-prod.azure-api.net   # or api.anthropic.com if you call Anthropic directly
#       ports: [443]

# features:
#     guardrails: false
#     memory: false
# Declare which secrets each workload may access. Platform-required secrets
# (MONGODB_URI, VOYAGE_API_KEY) are always injected and do not need to be listed.


# MONGODB_URI is injected, but DATABASE_NAME is not: the platform only scopes its
# own store DB (mdb_store, via runner_shared.db_config). Application collections
# live in a database this app names itself, so the tool pods have to be told which.
# BACKEND_URL is gone — the tools read MongoDB in-process, there is no backend call.
required_secrets:
    aer:
        - OPENAI_API_KEY
        - OPENAI_BASE_URL
        - DATABASE_NAME
    tools:
        "*":
            - DATABASE_NAME
        invoke_llm:
            - OPENAI_API_KEY
            - OPENAI_BASE_URL