[project]
name = "health-insurance-coordination"
version = "0.1.0"
description = "Insurance agent starter template for Agentic Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "runner-shared[mongodb,tracing]",
    "magenta-sdklanggraph",
    "python-dotenv>=1.0.0",
    # The tools read MongoDB in-process instead of calling a backend over HTTP.
    # Both arrive transitively today (pymongo via runner-shared[mongodb], pydantic
    # via the SDK), but the vendored data layer in `data/` imports them directly,
    # so they are declared here rather than relying on another package's extras.
    "pymongo>=4.6.0",
    "pydantic>=2.0.0",
    "langchain-google-genai>=2.1.0",
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "langchain-openai>=1.1.12",
    "langchain-anthropic>=1.4.0",
]

[project.scripts]
health-insurance-coordination = "agent_health_insurance_coordination.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_health_insurance_coordination"]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.1.0",
]

[tool.uv.sources]
runner-shared = { git = "https://github.com/10gen/magenta-client-libraries", subdirectory = "packages/runner-shared" }
magenta-sdklanggraph = { git = "https://github.com/10gen/magenta-client-libraries", subdirectory = "packages/magenta-sdklanggraph" }

[tool.ruff]
line-length = 100
target-version = "py311"
