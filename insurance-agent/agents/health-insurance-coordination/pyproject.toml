[project]
name = "health-insurance-coordination"
version = "0.1.0"
description = "Insurance agent starter template for Agentic Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "python-dotenv>=1.0.0",
    # Capped below 4.18: the platform-injected agent-engine SDK pulls
    # langgraph-checkpoint-mongodb, which requires pymongo<4.18.
    "pymongo>=4.6.0,<4.18",
    "pydantic>=2.0.0",
    "langchain-google-genai>=2.1.0",
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "langchain-openai>=1.1.12",
    "langchain-anthropic>=1.4.0",
    "protobuf>=6.33.6,<7",
]

[project.scripts]
health-insurance-coordination = "agent_health_insurance_coordination.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_health_insurance_coordination"]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.1.0",
]


[tool.ruff]
line-length = 100
target-version = "py311"
