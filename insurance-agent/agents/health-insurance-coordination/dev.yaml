# Local services exposed by the app during `agentic dev`.
# Most host ports are assigned randomly so multiple agents can run at once.
# The playground is pinned to 3001. Each agent runs its own local stack, so the two
# cannot share the default 3000 — this agent takes 3001, Care Coordination 3002, and
# the backend's INSURANCE_AGENT_URL must agree.
# To pin another service, uncomment its block, change the port, and restart
# the local stack.
services:
  playground:
    port: 3001
  # oe:
  #   port: 8000  # Orchestration Engine HTTP API.
  # aer:
  #   port: 8001  # Agent Execution Runtime.
  # tool:
  #   port: 8002  # Tool execution runtime.
  # memory-server:
  #   port: 8081  # Long-term memory service.
  # The tools read the application database (`health_insurance_agent`) directly, so
  # local dev has to point at the same remote Atlas cluster the backend and the
  # Care Coordination agent use. Left at the `local: true` default, the platform
  # starts an empty Atlas container and injects it as MONGODB_URI — every lookup
  # then returns "not found" and a case stops at Step 0 with nothing recorded.
  mongodb:
    local: false  # Default true. Set false to use a remote Atlas cluster in local dev.
  #   port: 27017  # Local Atlas host port; ignored when local is false.
