# Kanopy security and ownership (requires web-app chart v4.30.0+)
security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: paty.renartcarnicero@mongodb.com

env:
  NODE_ENV: prod
  AWS_REGION: us-east-1
  BACKEND_URL: http://health-insurance-backend-prod-web-app:80
  AGENT_INVOKE_MODE: http
  INSURANCE_DATABASE: care-coordination-insurance-agent   
  CLINICAL_DATABASE: care-coordination-health-agent    

## Single Pod Containers
envSecrets:
  # MongoDB Configuration
  MONGODB_URI: health-insurance-secrets                    
  AAE_CLIENT_ID: health-insurance-secrets                  
  AAE_CLIENT_SECRET: health-insurance-secrets              
  AAE_PROJECT_ID: health-insurance-secrets                 
  INSURANCE_AGENT_WORKSPACE_ID: health-insurance-secrets   
  CARE_AGENT_WORKSPACE_ID: health-insurance-secrets    

# Add IRSA configuration here, role here gives access to bedrock, s3, aws secrets manager
serviceAccount:
  enabled: true
  irsa:
    accountId: "275662791714"
    roleName: "kanopy-prod-cicd-irsa"