# Kanopy security and ownership (requires web-app chart v4.30.0+)
security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: paty.renartcarnicero@mongodb.com

env:
  NODE_ENV: staging
  AWS_REGION: us-east-1
  BACKEND_URL: http://health-insurance-backend-web-app:80
  AGENT_INVOKE_MODE: http

  LOCAL_AGENTIC_DEPLOYMENT: "false"

## Single Pod Containers
envSecrets:
  # MongoDB Configuration
  MONGODB_URI: health-insurance-secrets
  DATABASE_NAME: health-insurance-secrets

  AGENT_BASE_URL: health-insurance-secrets
  INSURANCE_AGENT_API_KEY: health-insurance-secrets
  INSURANCE_AGENT_PROJECT_ID: health-insurance-secrets
  INSURANCE_AGENT_WORKSPACE_ID: health-insurance-secrets
  CARE_AGENT_API_KEY: health-insurance-secrets
  CARE_AGENT_PROJECT_ID: health-insurance-secrets
  CARE_AGENT_WORKSPACE_ID: health-insurance-secrets

# Add IRSA configuration here, role here gives access to bedrock, s3, aws secrets manager
serviceAccount:
  enabled: true
  irsa:
    accountId: "275662791714"
    roleName: "kanopy-staging-cicd-irsa"