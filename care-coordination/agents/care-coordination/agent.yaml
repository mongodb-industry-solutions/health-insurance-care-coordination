# Human-readable app slug used by Agentic Platform tooling.
# `agentic create` should rewrite this when generating a new app from the template.
name: care-coordination
# Python import path to the Magenta SDK App instance.
# Format: <module path>:<variable name>. This template exposes `app` from
# src/agent_care_coordination/main.py.
entrypoint: agent_care_coordination.main:app
framework: langgraph
config:
    provider: openai
    model: gpt-5.4
features:
    memory: true
# Declare which secrets each workload may access. Platform-required secrets
# (MONGODB_URI, VOYAGE_API_KEY) are always injected and do not need to be listed.
# invoke_llm is a reserved tool name: the platform runs model calls in a tool
# pod, so the LLM provider key must also be declared under tools.invoke_llm.
# Replace the placeholder with your provider's key name (e.g. OPENAI_API_KEY).
required_secrets:
    aer:
        - OPENAI_API_KEY
        - OPENAI_BASE_URL
        - BACKEND_URL
    tools:
        invoke_llm:
            - OPENAI_API_KEY
            - OPENAI_BASE_URL
            - BACKEND_URL
