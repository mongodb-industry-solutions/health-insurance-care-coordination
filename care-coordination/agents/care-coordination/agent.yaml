# Human-readable app slug used by Agentic Platform tooling.

# `agentic create` should rewrite this when generating a new app from the template.

name: care-coordination
# Python import path to the Magenta SDK App instance.

# Format: <module path>:<variable name>. This template exposes `app` from

# src/agent_care_coordination/main.py.
entrypoint: agent_care_coordination.main:app
framework: langgraph
network:
  egress_mode: allow_list
  atlas_clusters:
    - ist-shared.n0kts.mongodb.net
  egress:
    # Without this the sandbox can reach Atlas but not the model gateway, and
    # every LLM call fails with "Connection error".
    - fqdn: grove-gateway-prod.azure-api.net
      ports: [443]
features:
  memory: true
# Declare which secrets each workload may access. Platform-required secrets

sandboxes:
  agent:
    secrets: ['*']
  tool:
    secrets: ['*']
    tools:
      - get_current_date
      - save_user_info
      - recall_user_info
      - get_member_clinical_context
      - get_open_case
      - match_clinical_concept
      - get_applicable_guideline
      - classify_treatment
      - evaluate_step_therapy
      - review_trial_history
      - detect_refill_gaps
      - resolve_refill_gap
      - compute_recommendation
      - record_reasoning_step
      - record_recommendation
      - get_member_authorizations
      
