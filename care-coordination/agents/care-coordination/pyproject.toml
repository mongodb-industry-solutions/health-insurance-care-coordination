[project]
name = "care-coordination"
version = "0.1.0"
description = "Minimal Magenta agent hello-world starter template"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "python-dotenv>=1.0.0",
    # The tools read MongoDB in-process instead of calling a backend over HTTP.
    # Both arrive transitively today (pymongo via runner-shared[mongodb], pydantic
    # via the SDK), but the vendored data layer in `data/` imports them directly,
    # so they are declared here rather than relying on another package's extras.
    "pymongo>=4.6.0,<4.18",
    "pydantic>=2.0.0",
    "langchain-openai>=1.1.12",
    "langchain-google-genai>=2.1.0",
    "langchain-anthropic>=1.4.0",
    "langchain-cerebras>=0.8.2",
    "protobuf>=6.33.6,<7",
]

[project.scripts]
care-coordination = "agent_care_coordination.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_care_coordination"]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.1.0",
]


[tool.ruff]
line-length = 100
target-version = "py311"
