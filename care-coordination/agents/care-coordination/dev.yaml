# Local services exposed by the app during `agentic dev`.
# Most host ports are assigned randomly so multiple agents can run at once.
# The playground is pinned to 3002. Each agent runs its own local stack, so the two
# cannot share the default 3000 — the Insurance Agent takes 3001, this one 3002, and
# the backend's CARE_AGENT_URL must agree.
# To pin another service, uncomment its block, change the port, and restart
# the local stack.
services:
  playground:
    port: 3002
  # oe:
  #   port: 8000  # Orchestration Engine HTTP API.
  # aer:
  #   port: 8001  # Agent Execution Runtime.
  # tool:
  #   port: 8002  # Tool execution runtime.
  # memory-server:
  #   port: 8081  # Long-term memory service.
  mongodb:
    local: false  # Default true. Set false to use a remote Atlas cluster in local dev.
  #   port: 27017  # Local Atlas host port; ignored when local is false.
