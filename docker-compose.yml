services:
  health-insurance-backend:
    build:
      context: .
      no_cache: true
      dockerfile: Dockerfile.backend
    image: health-insurance-backend:latest
    volumes:
      - ~/.aws/credentials:/root/.aws/credentials:ro
      - ~/.aws/config:/root/.aws/config:ro
      - ~/.aws/sso/cache:/root/.aws/sso/cache:rw  # Only make cache writable
    ports:
      - "8000:8080"
    restart: always
    container_name: health-insurance-backend
    networks:
      - default
      - insurance_agent_network
      - care_agent_network
  health-insurance-frontend:
    build:
      context: .
      no_cache: true
      dockerfile: Dockerfile.frontend
    image: health-insurance-frontend:latest
    ports:
      - "3000:8080"
    environment:
      # Container-to-container: 8080 is the backend's internal listener, not the
      # host mapping. Next reads this at server start (see next.config.mjs).
      - BACKEND_URL=http://health-insurance-backend:8080
    restart: always
    container_name: health-insurance-frontend
networks:
  insurance_agent_network:
    external: true
    name: health-insurance-coordination_default
  care_agent_network:
    external: true
    name: care-coordination_default